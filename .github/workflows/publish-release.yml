name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WidgetEnhancer-0.8.2.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## WidgetEnhancer 0.8.2

          为 Xiaomi MIX Flip 外屏提供自定义小部件能力的 LSPosed 模块。

          ### 主要更新
          - 新增免授权小部件绑定
          - 优化通知跳转

          ### LSPosed 作用域
          必选：`com.miui.fliphome`
          免授权小部件绑定：`android`

          可选：
          - `com.netease.cloudmusic`
          - `com.android.systemui`

          安装后请在 LSPosed 中启用模块并重启设备。
          EOF

          gh release create "21-0.8.2" \
            "dist/WidgetEnhancer-0.8.2.apk" \
            --target "$GITHUB_SHA" \
            --title "WidgetEnhancer 0.8.2" \
            --notes-file /tmp/release-notes.md
