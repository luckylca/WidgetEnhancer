name: Publish Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release after successful build and signature verification'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - '*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WIDGETENHANCER_STORE_PASSWORD: ${{ secrets.WIDGETENHANCER_STORE_PASSWORD }}
      WIDGETENHANCER_KEY_ALIAS: ${{ secrets.WIDGETENHANCER_KEY_ALIAS }}
      WIDGETENHANCER_KEY_PASSWORD: ${{ secrets.WIDGETENHANCER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          WIDGETENHANCER_KEYSTORE_BASE64: ${{ secrets.WIDGETENHANCER_KEYSTORE_BASE64 }}
        run: |
          test -n "$WIDGETENHANCER_KEYSTORE_BASE64"
          KEYSTORE="$RUNNER_TEMP/widgetenhancer-release.p12"
          printf '%s' "$WIDGETENHANCER_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "WIDGETENHANCER_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify release signature
        env:
          EXPECTED_CERT_SHA256: 996d10e602eb6e0a1cd8a3853128d6ce4d4e456078d93eb2ce27e655d9f89215
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          echo "Verified release certificate SHA-256: $ACTUAL_CERT_SHA256"

      - name: Determine release metadata
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]+' app/build.gradle | awk '{print $2}')"
          VERSION="$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]+' app/build.gradle | cut -d "'" -f2)"
          TAG="${VERSION_CODE}-${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Gradle version $TAG"
            exit 1
          fi
          test -f "docs/releases/${VERSION}.md"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET=WidgetEnhancer-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Prepare APK
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$ASSET"

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/$ASSET" \
            --target "$GITHUB_SHA" \
            --title "WidgetEnhancer $VERSION" \
            --notes-file "docs/releases/${VERSION}.md"
