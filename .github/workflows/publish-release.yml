name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WidgetEnhancer-0.8.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## WidgetEnhancer 0.8.0

          为 Xiaomi MIX Flip 外屏提供自定义小部件能力的 LSPosed 模块。

          ### 主要更新
          - 新增通知小部件：显示最近 3 条通知，支持点击打开与左滑删除
          - 新增应用小部件页面：2 × 3 网格自由摆放 Android AppWidget
          - 支持 1×1、2×1、1×2、2×2、1×3、2×3 槽位与拖动布局
          - 新增 ZIP / MTZ MAML 小部件导入，可使用 FlipHome 原生宿主渲染
          - 支持 AppWidget 与 MAML 小部件混合布局、尺寸调整和圆角控制
          - 音乐歌词大小支持 70%～160% 调节
          - 保留媒体、音乐、快捷按钮、网易云歌词与 SystemUI 快捷设置能力

          ### LSPosed 作用域
          必选：`com.miui.fliphome`

          可选：
          - `com.netease.cloudmusic`
          - `com.android.systemui`

          安装后请在 LSPosed 中启用模块并重启设备。
          EOF

          gh release create "19-0.8.0" \
            "dist/WidgetEnhancer-0.8.0.apk" \
            --target "$GITHUB_SHA" \
            --title "WidgetEnhancer 0.8.0" \
            --notes-file /tmp/release-notes.md
