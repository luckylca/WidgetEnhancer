plugins {
    id 'com.android.application'
}

repositories {
    // Some local Gradle init scripts replace settings repositories; keep JitPack visible there too.
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://api.xposed.info/') }
}

def localSigning = [:]
def localSigningFile = new File(System.getProperty('user.home'), '.config/widgetenhancer/signing.env')
if (localSigningFile.isFile()) {
    localSigningFile.eachLine { rawLine ->
        def line = rawLine.trim()
        if (line && !line.startsWith('#')) {
            def split = line.indexOf('=')
            if (split > 0) {
                localSigning[line.substring(0, split)] = line.substring(split + 1)
            }
        }
    }
}

def signingValue = { String key ->
    def envValue = System.getenv(key)
    if (envValue != null && !envValue.isEmpty()) {
        return envValue
    }
    return localSigning[key]
}

def releaseKeystorePath = signingValue('WIDGETENHANCER_KEYSTORE_PATH')
def releaseStorePassword = signingValue('WIDGETENHANCER_STORE_PASSWORD')
def releaseKeyAlias = signingValue('WIDGETENHANCER_KEY_ALIAS')
def releaseKeyPassword = signingValue('WIDGETENHANCER_KEY_PASSWORD')
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { it != null && !it.isEmpty() }

android {
    namespace 'com.lucky.mixflipouter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lucky.mixflipouter'
        minSdk 30
        targetSdk 36
        versionCode 24
        versionName '0.9.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException(
                'Release signing is not configured. Set WIDGETENHANCER_* signing variables ' +
                'or create ~/.config/widgetenhancer/signing.env.')
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.google.android.material:material:1.14.0'
    // Pinned to the API revision SuperLyric 3.3 ships with; 3.5 adds parcel fields
    // and a manager transaction the 3.3 service does not have.
    implementation 'com.github.HChenX:SuperLyricApi:3.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
